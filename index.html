<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WordBlip</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0d;
        --panel: #15151a;
        --text: #f5f5f7;
        --muted: #a8a8b3;
        --accent: #ffd400;
        --border: #2a2a33;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 56px 20px 72px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 28px;
      }

      h1, h2 {
        margin: 0 0 12px;
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 24px;
      }

      a.button {
        display: inline-block;
        padding: 12px 16px;
        border-radius: 12px;
        background: var(--accent);
        color: #111114;
        font-weight: 700;
        text-decoration: none;
      }

      a.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>WordBlip</h1>
        <p>
          WordBlip is a focused RSVP speed-reading trainer designed to help you
          improve reading speed, comprehension, and consistency with a calm,
          low-friction experience.
        </p>
        <div class="actions">
          <a class="button" href="./support.html">Support</a>
          <a class="button secondary" href="./privacy.html">Privacy Policy</a>
        </div>
      </section>
    </main>
  </body>
</html>
